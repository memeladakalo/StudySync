<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudySync – Profile</title>
  
  <style>
    /* --- General Body Styling --- */
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #e0f7fa 0%, #fff9c4 100%);
      margin: 0;
      color: #333;
    }

    /* --- Header --- */
    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background-color: #0077ff;
      color: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
    }

    .top-nav button {
      background: white;
      color: #0077ff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      margin-left: 10px;
      font-weight: 500;
      transition: background 0.2s;
    }

    .top-nav button:hover {
      background: #e0e0e0;
    }

    /* --- Main Profile Section --- */
    .profile-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .profile-section h2 {
      font-size: 2rem;
      margin-bottom: 25px;
      color: #0077ff;
    }

    .profile-card {
      background: white;
      padding: 30px 25px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .profile-card img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid #0077ff;
      object-fit: cover;
      margin-bottom: 15px;
    }

    .profile-card input[type="file"] {
      margin-bottom: 20px;
    }

    .profile-card label {
      align-self: flex-start;
      font-weight: 600;
      margin-top: 10px;
      margin-bottom: 5px;
      font-size: 14px;
    }

    .profile-card input[type="text"],
    .profile-card textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-bottom: 15px;
      font-size: 14px;
      resize: none;
    }

    .profile-card textarea {
      min-height: 80px;
    }

    .btn {
      cursor: pointer;
      font-weight: 600;
      border-radius: 8px;
      padding: 10px 20px;
      border: none;
      font-size: 16px;
      transition: all 0.2s;
    }

    .btn.primary {
      background-color: #0077ff;
      color: white;
      width: 100%;
    }

    .btn.primary:hover {
      background-color: #005fcc;
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="logo">🎓 StudySync</div>
    <nav class="top-nav">
      <button onclick="window.location='index.html'">🏠 Home</button>
      <button id="logoutBtn">🚪 Logout</button>
    </nav>
  </header>

  <main class="profile-section">
    <h2>My Profile</h2>
    <div class="profile-card">
      <img src="assets/User-Avatar-PNG-Picture.png" alt="User Avatar" id="profileAvatar" />
      <input type="file" id="avatarUpload" accept="image/*" />
      
      <label for="profileName">Name</label>
      <input type="text" id="profileName" placeholder="Your Name" />

      <label for="profileBio">Bio</label>
      <textarea id="profileBio" placeholder="Write something about yourself..."></textarea>

      <button id="saveProfileBtn" class="btn primary">Save Profile</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
