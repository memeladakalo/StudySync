<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>StudySync – Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-page">
  <main class="auth-container">
    <h1>🎓 StudySync</h1>
    <h2>Welcome Back</h2>
    <form id="loginForm">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" required placeholder="Enter your email" />

      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" required placeholder="Enter your password" />
      <input type="checkbox" id="rememberMe" /> Remember Me
      <button type="submit" class="btn primary">Login</button>
      <p class="auth-switch">Don’t have an account? <a href="signup.html">Sign up</a></p>
      <p><a href="forgot-password.html">Forgot your password?</a></p>

      <div class="soial login">
        <button class="btn google">Login with google</button>
        <button class="btn facebook">Login with facebook</button>
      </div>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
